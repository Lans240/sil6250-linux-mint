<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- sil6250d (runs as root) may own this well-known name -->
  <policy user="root">
    <allow own="io.github.uunicorn.Fprint"/>
  </policy>

  <!-- open-fprintd (runs as root) may call methods on the device interface -->
  <policy user="root">
    <allow send_destination="io.github.uunicorn.Fprint"
           send_interface="io.github.uunicorn.Fprint.Device"/>
  </policy>
</busconfig>
